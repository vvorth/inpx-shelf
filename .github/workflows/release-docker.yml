name: Release Docker images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        default: v1.0.0-beta.1

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: .
            target: runtime
            suffix: ''
          - component: silero
            context: tts/silero
            target: ''
            suffix: -silero
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # All release tags are needed to tell whether this is the newest release.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: npm run test:release
      - run: npm run test:tts
      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const {execFileSync} = require('child_process');
          const versionPattern = /^\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$/;
          const version = require('./package.json').version;
          if (process.env.RELEASE_TAG !== `v${version}` || !versionPattern.test(version)) {
            throw new Error('Tag and package version must match');
          }

          // SemVer order: 1.0.0-beta.2 < 1.0.0-rc.1 < 1.0.0 < 1.0.1.
          const parse = value => {
            const [main, pre] = value.split('-');
            return {main: main.split('.').map(Number), pre: pre ? pre.split('.') : null};
          };
          const compare = (left, right) => {
            const a = parse(left), b = parse(right);
            for (let i = 0; i < 3; i++)
              if (a.main[i] !== b.main[i]) return a.main[i] - b.main[i];
            if (!a.pre || !b.pre) return (a.pre ? -1 : 0) + (b.pre ? 1 : 0);
            if (a.pre[0] !== b.pre[0]) return a.pre[0] < b.pre[0] ? -1 : 1;
            return Number(a.pre[1]) - Number(b.pre[1]);
          };

          // latest follows the newest stable release, beta the newest pre-release. Rebuilding
          // an older tag by hand only refreshes its own version tag.
          const prerelease = version.includes('-');
          const newest = execFileSync('git', ['tag', '--list', 'v*'], {encoding: 'utf8'})
            .split('\n').map(tag => tag.trim().replace(/^v/, ''))
            .filter(tag => versionPattern.test(tag) && tag.includes('-') === prerelease)
            .every(tag => compare(tag, version) <= 0);
          const channel = newest ? (prerelease ? 'beta' : 'latest') : '';

          const image = 'vvorth/inpx-shelf';
          const suffix = process.env.SUFFIX;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}:${version}${suffix}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `channel_image=${channel ? `${image}:${channel}${suffix}` : ''}\n`);
          console.log(channel ? `Also publishing ${image}:${channel}${suffix}` : `${version} is not the newest release; channel tags stay as they are`);
          NODE
      - name: Build image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          CONTEXT: ${{ matrix.context }}
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          docker build "${args[@]}" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" "$CONTEXT"
      - name: Test packaged web application
        if: matrix.component == 'web'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: node scripts/binary-smoke-test.js --image "$IMAGE"
      - name: Test Silero text preparation and real audio
        if: matrix.component == 'silero'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker run --rm -v "$PWD/tts/silero/test_server.py:/app/test_server.py:ro" "$IMAGE" python -m unittest -v test_server
          docker run -d --name silero-test -p 127.0.0.1:18080:8000 -v "$RUNNER_TEMP/inpx-silero-models:/models" "$IMAGE"
          trap 'docker logs silero-test; docker rm -f silero-test' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 2
          done
          node scripts/reader-speech-tests.js --silero-url http://127.0.0.1:18080
          docker stop silero-test
          docker rm silero-test
          docker run -d --name silero-test -p 127.0.0.1:18080:8000 -e SILERO_STRESS_ENABLED=false -v "$RUNNER_TEMP/inpx-silero-models:/models" "$IMAGE"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 2
          done
          node scripts/reader-speech-tests.js --silero-url http://127.0.0.1:18080
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish versioned image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: docker push "$IMAGE"
      - name: Publish latest or beta tag
        if: steps.version.outputs.channel_image != ''
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          CHANNEL_IMAGE: ${{ steps.version.outputs.channel_image }}
        run: |
          docker tag "$IMAGE" "$CHANNEL_IMAGE"
          docker push "$CHANNEL_IMAGE"
