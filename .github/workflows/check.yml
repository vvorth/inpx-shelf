name: Check

# The one test run every event goes through: ci.yml (pull requests, dev, main) and
# release.yml (tags) call it, and publish only after it passes.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (empty means the ref of the calling event)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Test and package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            extension: ''
          - os: windows-latest
            target: win
            extension: .exe
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Platform-independent checks run once, on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=moderate
      - if: runner.os == 'Linux'
        run: npx eslint --quiet server shared scripts build client --ext .js,.vue
      - if: runner.os == 'Linux'
        run: npm run test:i18n
      - run: npm run test:release
      - run: npm run build:${{ matrix.target }}
      - run: node scripts/binary-smoke-test.js dist/${{ matrix.target }}/inpx-shelf${{ matrix.extension }}
