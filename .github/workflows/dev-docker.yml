name: Dev Docker image

# Every push to develop publishes vvorth/inpx-shelf:dev (newest develop build) and
# vvorth/inpx-shelf:dev-<commit> (that exact build). Releases stay on version tags.
on:
  push:
    branches: [develop]

permissions:
  contents: read

# A newer push makes the build in progress pointless: dev should be the newest commit.
concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  publish:
    name: Build, test and publish dev image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: npm run test:release
      - run: npm run test:tts
      - name: Build image
        run: docker build --target runtime --label "org.opencontainers.image.revision=$GITHUB_SHA" -t inpx-shelf:dev .
      - name: Test packaged web application
        run: node scripts/binary-smoke-test.js --image inpx-shelf:dev
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish dev image
        run: |
          for tag in dev "dev-${GITHUB_SHA::7}"; do
            docker tag inpx-shelf:dev "vvorth/inpx-shelf:$tag"
            docker push "vvorth/inpx-shelf:$tag"
          done
      - name: Remove old dev tags
        # Deleting tags needs a Docker Hub token with the Delete permission. Without it this step
        # warns and fails on its own, but the dev image above is already published.
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP_DEV_TAGS: 10
        run: |
          node <<'NODE'
          const api = 'https://hub.docker.com/v2';
          const repo = 'vvorth/inpx-shelf';
          const keep = Number(process.env.KEEP_DEV_TAGS);

          async function call(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok)
              throw new Error(`${options.method || 'GET'} ${url}: ${response.status} ${await response.text()}`);
            return (response.status === 204 ? null : response.json());
          }

          (async() => {
            const {access_token: token} = await call(`${api}/auth/token`, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({identifier: process.env.DOCKERHUB_USERNAME, secret: process.env.DOCKERHUB_TOKEN}),
            });
            const headers = {Authorization: `Bearer ${token}`};

            const tags = [];
            for (let url = `${api}/repositories/${repo}/tags?page_size=100`; url;) {
              const page = await call(url, {headers});
              tags.push(...page.results);
              url = page.next;
            }

            // Only per-commit dev tags: dev, beta, latest and version tags are never removed.
            const pushedAt = tag => Date.parse(tag.tag_last_pushed || tag.last_updated);
            const old = tags
              .filter(tag => /^dev-[0-9a-f]{7}$/.test(tag.name))
              .sort((a, b) => pushedAt(b) - pushedAt(a))
              .slice(keep);
            for (const tag of old) {
              await call(`${api}/repositories/${repo}/tags/${tag.name}/`, {method: 'DELETE', headers});
              console.log(`Removed ${repo}:${tag.name}`);
            }
            console.log(`Kept the newest ${keep} dev-<commit> tags, removed ${old.length}`);
          })().catch(error => {
            console.log(`::warning::Old dev tags were not removed: ${error.message}`);
            process.exitCode = 1;
          });
          NODE
