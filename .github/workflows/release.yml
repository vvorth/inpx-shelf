name: Release

# A v* tag (or a manual run for an existing tag): check the version, test once, then build and
# publish the binaries to GitHub Releases and the images to Docker Hub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Same version as FB2CNG_VERSION in the Dockerfile; update fbc_sha256 below with it.
  FB2CNG_RELEASE_API: https://api.github.com/repos/rupor-github/fb2cng/releases/tags/v1.9.1

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      channel_image: ${{ steps.version.outputs.channel_image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          # All release tags are needed to tell whether this is the newest release.
          fetch-depth: 0
      - id: version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const {execFileSync} = require('child_process');
          const versionPattern = /^\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$/;
          const version = require('./package.json').version;
          if (process.env.RELEASE_TAG !== `v${version}` || !versionPattern.test(version)) {
            throw new Error('Tag and package version must match');
          }

          // SemVer order: 1.0.0-beta.2 < 1.0.0-rc.1 < 1.0.0 < 1.0.1.
          const parse = value => {
            const [main, pre] = value.split('-');
            return {main: main.split('.').map(Number), pre: pre ? pre.split('.') : null};
          };
          const compare = (left, right) => {
            const a = parse(left), b = parse(right);
            for (let i = 0; i < 3; i++)
              if (a.main[i] !== b.main[i]) return a.main[i] - b.main[i];
            if (!a.pre || !b.pre) return (a.pre ? -1 : 0) + (b.pre ? 1 : 0);
            if (a.pre[0] !== b.pre[0]) return a.pre[0] < b.pre[0] ? -1 : 1;
            return Number(a.pre[1]) - Number(b.pre[1]);
          };

          // latest follows the newest stable release, beta the newest pre-release. Rebuilding
          // an older tag by hand only refreshes its own version tag.
          const prerelease = version.includes('-');
          const newest = execFileSync('git', ['tag', '--list', 'v*'], {encoding: 'utf8'})
            .split('\n').map(tag => tag.trim().replace(/^v/, ''))
            .filter(tag => versionPattern.test(tag) && tag.includes('-') === prerelease)
            .every(tag => compare(tag, version) <= 0);
          const channel = newest ? (prerelease ? 'beta' : 'latest') : '';

          const image = 'vvorth/inpx-shelf';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}:${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `channel_image=${channel ? `${image}:${channel}` : ''}\n`);
          console.log(channel ? `Also publishing ${image}:${channel}` : `${version} is not the newest release; channel tags stay as they are`);
          NODE

  check-linux:
    needs: version
    uses: ./.github/workflows/check.yml
    with:
      target: linux
      ref: ${{ inputs.tag || github.ref_name }}

  check-windows:
    needs: version
    uses: ./.github/workflows/check.yml
    with:
      target: win
      ref: ${{ inputs.tag || github.ref_name }}

  binaries:
    name: Build ${{ matrix.label }}
    needs: [version, check-linux, check-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
            target: linux
            fbc_asset: fbc-linux-amd64.zip
            fbc_sha256: 51ae29f268994374fdbf9e7244f37510b46aa9a0439bd57eb89c7c0924359174
          - os: ubuntu-24.04-arm
            label: Linux arm64
            target: linux-arm64
            fbc_asset: fbc-linux-arm64.zip
            fbc_sha256: 53aeef47359de5782c0e504aa76e69b985c44e612a138cceebe412462b804041
          - os: windows-latest
            label: Windows x64
            target: win
            fbc_asset: fbc-windows-amd64.zip
            fbc_sha256: e688a0a4f38a57476ca213ccb7c16c0140c74f28eb8733ea42ce5ccbd3ce596a
          - os: macos-15-intel
            label: macOS x64
            target: macos
            fbc_asset: fbc-darwin-amd64.zip
            fbc_sha256: 1448e4b33974ffc31dbfdfc46cbfc7a6ad90b40b1dc2a82bc7d5685c1c78bad4
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:${{ matrix.target }}
      - name: Test packaged application
        shell: bash
        run: node scripts/binary-smoke-test.js dist/${{ matrix.target }}/inpx-shelf${{ matrix.target == 'win' && '.exe' || '' }}

      - name: Install Inno Setup
        if: matrix.target == 'win'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Bundle Windows cover tools
        if: matrix.target == 'win'
        shell: pwsh
        run: npm run build:win-tools

      - name: Bundle fb2cng converter
        shell: pwsh
        run: |
          $binDir = Join-Path $PWD "dist/${{ matrix.target }}/bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          $githubHeaders = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $fb2cngRelease = Invoke-RestMethod -Uri $env:FB2CNG_RELEASE_API -Headers $githubHeaders
          $fb2cngAsset = $fb2cngRelease.assets |
            Where-Object { $_.name -eq '${{ matrix.fbc_asset }}' } |
            Select-Object -First 1
          if (-not $fb2cngAsset) {
            throw 'Unable to find fb2cng asset ${{ matrix.fbc_asset }} in the release'
          }

          $fbcArchive = Join-Path $env:RUNNER_TEMP $fb2cngAsset.name
          $fbcExtract = Join-Path $env:RUNNER_TEMP "fb2cng-${{ matrix.target }}"
          if (Test-Path $fbcExtract) {
            Remove-Item $fbcExtract -Recurse -Force
          }

          Invoke-WebRequest -Uri $fb2cngAsset.browser_download_url -OutFile $fbcArchive
          $fbcHash = (Get-FileHash -Path $fbcArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fbcHash -ne '${{ matrix.fbc_sha256 }}') {
            throw "SHA-256 mismatch for $($fb2cngAsset.name): $fbcHash"
          }
          Expand-Archive -Path $fbcArchive -DestinationPath $fbcExtract -Force

          $fbcFileName = if ('${{ matrix.target }}' -eq 'win') { 'fbc.exe' } else { 'fbc' }
          $fbcSource = Get-ChildItem -Path $fbcExtract -Recurse -File |
            Where-Object { $_.Name -eq $fbcFileName } |
            Select-Object -First 1
          if (-not $fbcSource) {
            throw "Unable to find $fbcFileName in $($fb2cngAsset.name)"
          }

          $fbcTarget = Join-Path $binDir $fbcFileName
          Copy-Item $fbcSource.FullName -Destination $fbcTarget -Force
          if ('${{ matrix.target }}' -ne 'win') {
            chmod +x $fbcTarget
          }

      - name: Archive release payload
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $srcDir = Join-Path $PWD ("dist/{0}" -f "${{ matrix.target }}")
          if (-not (Test-Path $srcDir)) {
            throw "Build output directory not found: $srcDir"
          }
          $outDir = Join-Path $PWD "dist/release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $archiveName = "inpx-shelf-$version-${{ matrix.target }}.zip"
          $archivePath = Join-Path $outDir $archiveName
          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }
          Compress-Archive -Path (Join-Path $srcDir '*') -DestinationPath $archivePath -Force

      - name: Build Windows installer
        if: matrix.target == 'win'
        shell: pwsh
        run: npm run build:win-installer

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  github-release:
    name: Upload release assets
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --dir release-assets
      - name: Prepare release notes
        run: |
          node <<'NODE'
          const fs = require('fs');

          const tag = process.env.RELEASE_TAG || '';
          const version = tag.replace(/^v/, '');
          const text = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
          const lines = text.split('\n');
          const start = lines.findIndex(line => line.startsWith(`${version} / `));
          let body = '';

          if (start >= 0) {
            let end = lines.length;
            for (let i = start + 1; i < lines.length; i++) {
              if (/^\d+\.\d+\.\d+(?:[-.][^\s/]+)?\s+\//.test(lines[i])) {
                end = i;
                break;
              }
            }
            body = lines.slice(start, end).join('\n').trim();
          }

          fs.writeFileSync('release-notes.md', `${body || `Release ${tag}`}\n`);
          NODE
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: release-notes.md
          files: |
            release-assets/**/*.zip
            release-assets/**/*.exe
          overwrite_files: true

  docker:
    name: Docker images
    needs: [version, check-linux, check-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE: ${{ needs.version.outputs.image }}
      CHANNEL_IMAGE: ${{ needs.version.outputs.channel_image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      # Two images: the default one (fb2cng) and IMAGE-pdf with MuPDF for PDF output.
      - name: Build images
        run: |
          REVISION=$(git rev-parse HEAD)
          docker build --target runtime --label "org.opencontainers.image.revision=$REVISION" -t "$IMAGE" .
          docker build --target runtime-pdf --label "org.opencontainers.image.revision=$REVISION" -t "$IMAGE-pdf" .
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test packaged web application
        run: |
          node scripts/binary-smoke-test.js --image "$IMAGE"
          node scripts/binary-smoke-test.js --image "$IMAGE-pdf"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish versioned images
        run: |
          docker push "$IMAGE"
          docker push "$IMAGE-pdf"
      - name: Publish latest or beta tag
        if: env.CHANNEL_IMAGE != ''
        run: |
          for suffix in "" -pdf; do
            docker tag "$IMAGE$suffix" "$CHANNEL_IMAGE$suffix"
            docker push "$CHANNEL_IMAGE$suffix"
          done
