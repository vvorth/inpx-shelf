name: Release

# Rolling release: Actions -> Release -> Run workflow publishes the current head of dev as
# version YY.M.N (26.10.0, 26.10.1, ...: N counts the releases of the month). After the checks
# pass it turns the "Unreleased" section of CHANGELOG.md into the release notes, sets the version
# in package.json, commits to dev, fast-forwards main to that commit and tags it, then publishes
# the binaries to GitHub Releases and the images to Docker Hub as <version> and latest.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Same version as FB2CNG_VERSION in the Dockerfile and in scripts/bundle-windows-tools.ps1 (Windows); update fbc_sha256 below with it.
  FB2CNG_RELEASE_API: https://api.github.com/repos/rupor-github/fb2cng/releases/tags/v1.9.1

jobs:
  version:
    name: Pick the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      date: ${{ steps.version.outputs.date }}
      sha: ${{ steps.version.outputs.sha }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          # All tags are needed to number the release within its month.
          fetch-depth: 0
      - id: version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const {execFileSync} = require('child_process');
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8'}).trim();

          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n').split('\n');
          // releases are "<version> / <date>"; sections before CalVer have only a date and stay in the
          // first CalVer release notes
          const end = lines.findIndex((line, index) => index > 0 && /^\d+\.\d+\.\d+(?:[-.][^\s/]+)?\s+\//.test(line));
          if (lines[0].trim() !== 'Unreleased' || !lines.slice(1, end < 0 ? lines.length : end).some(line => line.startsWith('- ')))
            throw new Error('CHANGELOG.md does not start with an "Unreleased" section listing the changes: nothing to release');

          // SemVer forbids leading zeros, so the month is 9, not 09.
          const now = new Date();
          const month = `${now.getUTCFullYear() % 100}.${now.getUTCMonth() + 1}`;
          const numbers = git('tag', '--list', `v${month}.*`).split('\n')
            .map(tag => tag.match(/^v\d+\.\d+\.(\d+)$/)).filter(Boolean).map(match => Number(match[1]));
          const version = `${month}.${numbers.length ? Math.max(...numbers) + 1 : 0}`;

          const output = {
            version,
            tag: `v${version}`,
            date: now.toISOString().slice(0, 10),
            sha: git('rev-parse', 'HEAD'),
            image: `vvorth/inpx-shelf:${version}`,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(output).map(([key, value]) => `${key}=${value}\n`).join(''));
          console.log(`Releasing ${output.sha} as ${version}`);
          NODE

  check-linux:
    needs: version
    uses: ./.github/workflows/check.yml
    with:
      target: linux
      ref: ${{ needs.version.outputs.sha }}

  check-windows:
    needs: version
    uses: ./.github/workflows/check.yml
    with:
      target: win
      ref: ${{ needs.version.outputs.sha }}

  tag:
    name: Commit and tag the release
    needs: [version, check-linux, check-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set the version
        run: |
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('CHANGELOG.md', 'utf8');
          fs.writeFileSync('CHANGELOG.md', text.replace(/^Unreleased(?=\r?\n)/, `${process.env.VERSION} / ${process.env.RELEASE_DATE}`));
          NODE
      # One atomic push: if dev got new commits during the run or main is not an ancestor of
      # the release commit, nothing is pushed and nothing is published.
      - name: Push to dev and main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -am "Release $VERSION"
          git tag "$TAG"
          git push --atomic origin HEAD:refs/heads/dev HEAD:refs/heads/main "refs/tags/$TAG"

  binaries:
    name: Build ${{ matrix.label }}
    needs: [version, tag]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
            target: linux
            fbc_asset: fbc-linux-amd64.zip
            fbc_sha256: 51ae29f268994374fdbf9e7244f37510b46aa9a0439bd57eb89c7c0924359174
          - os: ubuntu-24.04-arm
            label: Linux arm64
            target: linux-arm64
            fbc_asset: fbc-linux-arm64.zip
            fbc_sha256: 53aeef47359de5782c0e504aa76e69b985c44e612a138cceebe412462b804041
          - os: windows-latest
            label: Windows x64
            target: win
            fbc_asset: fbc-windows-amd64.zip
            fbc_sha256: e688a0a4f38a57476ca213ccb7c16c0140c74f28eb8733ea42ce5ccbd3ce596a
          - os: macos-15-intel
            label: macOS x64
            target: macos
            fbc_asset: fbc-darwin-amd64.zip
            fbc_sha256: 1448e4b33974ffc31dbfdfc46cbfc7a6ad90b40b1dc2a82bc7d5685c1c78bad4
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:${{ matrix.target }}
      - name: Test packaged application
        shell: bash
        run: node scripts/binary-smoke-test.js dist/${{ matrix.target }}/inpx-shelf${{ matrix.target == 'win' && '.exe' || '' }}

      - name: Install Inno Setup
        if: matrix.target == 'win'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Restore Windows tool archives
        if: matrix.target == 'win'
        uses: actions/cache@v4
        with:
          path: dist/tools-cache
          key: windows-tools-${{ hashFiles('scripts/bundle-windows-tools.ps1') }}

      # djxl, dwebp and fbc, pinned in the script
      - name: Bundle Windows tools
        if: matrix.target == 'win'
        shell: pwsh
        run: npm run build:win-tools

      - name: Bundle fb2cng converter
        if: matrix.target != 'win'
        shell: pwsh
        run: |
          $binDir = Join-Path $PWD "dist/${{ matrix.target }}/bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          $githubHeaders = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $fb2cngRelease = Invoke-RestMethod -Uri $env:FB2CNG_RELEASE_API -Headers $githubHeaders
          $fb2cngAsset = $fb2cngRelease.assets |
            Where-Object { $_.name -eq '${{ matrix.fbc_asset }}' } |
            Select-Object -First 1
          if (-not $fb2cngAsset) {
            throw 'Unable to find fb2cng asset ${{ matrix.fbc_asset }} in the release'
          }

          $fbcArchive = Join-Path $env:RUNNER_TEMP $fb2cngAsset.name
          $fbcExtract = Join-Path $env:RUNNER_TEMP "fb2cng-${{ matrix.target }}"
          if (Test-Path $fbcExtract) {
            Remove-Item $fbcExtract -Recurse -Force
          }

          Invoke-WebRequest -Uri $fb2cngAsset.browser_download_url -OutFile $fbcArchive
          $fbcHash = (Get-FileHash -Path $fbcArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fbcHash -ne '${{ matrix.fbc_sha256 }}') {
            throw "SHA-256 mismatch for $($fb2cngAsset.name): $fbcHash"
          }
          Expand-Archive -Path $fbcArchive -DestinationPath $fbcExtract -Force

          $fbcFileName = if ('${{ matrix.target }}' -eq 'win') { 'fbc.exe' } else { 'fbc' }
          $fbcSource = Get-ChildItem -Path $fbcExtract -Recurse -File |
            Where-Object { $_.Name -eq $fbcFileName } |
            Select-Object -First 1
          if (-not $fbcSource) {
            throw "Unable to find $fbcFileName in $($fb2cngAsset.name)"
          }

          $fbcTarget = Join-Path $binDir $fbcFileName
          Copy-Item $fbcSource.FullName -Destination $fbcTarget -Force
          if ('${{ matrix.target }}' -ne 'win') {
            chmod +x $fbcTarget
          }

      - name: Archive release payload
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $srcDir = Join-Path $PWD ("dist/{0}" -f "${{ matrix.target }}")
          if (-not (Test-Path $srcDir)) {
            throw "Build output directory not found: $srcDir"
          }
          $outDir = Join-Path $PWD "dist/release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $archiveName = "inpx-shelf-$version-${{ matrix.target }}.zip"
          $archivePath = Join-Path $outDir $archiveName
          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }
          Compress-Archive -Path (Join-Path $srcDir '*') -DestinationPath $archivePath -Force

      - name: Build Windows installer
        if: matrix.target == 'win'
        shell: pwsh
        run: npm run build:win-installer

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  github-release:
    name: Upload release assets
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --dir release-assets
      - name: Prepare release notes
        run: |
          node <<'NODE'
          const fs = require('fs');

          const tag = process.env.RELEASE_TAG || '';
          const version = tag.replace(/^v/, '');
          const text = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
          const lines = text.split('\n');
          const start = lines.findIndex(line => line.startsWith(`${version} / `));
          let body = '';

          if (start >= 0) {
            let end = lines.length;
            for (let i = start + 1; i < lines.length; i++) {
              if (/^\d+\.\d+\.\d+(?:[-.][^\s/]+)?\s+\//.test(lines[i])) {
                end = i;
                break;
              }
            }
            body = lines.slice(start, end).join('\n').trim();
          }

          fs.writeFileSync('release-notes.md', `${body || `Release ${tag}`}\n`);
          NODE
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          make_latest: true
          body_path: release-notes.md
          files: |
            release-assets/**/*.zip
            release-assets/**/*.exe
          overwrite_files: true

  docker:
    name: Docker images
    needs: [version, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE: ${{ needs.version.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      # Two images: the default one (fb2cng) and IMAGE-pdf with MuPDF for PDF output.
      - name: Build images
        run: |
          REVISION=$(git rev-parse HEAD)
          docker build --target runtime --label "org.opencontainers.image.revision=$REVISION" -t "$IMAGE" .
          docker build --target runtime-pdf --label "org.opencontainers.image.revision=$REVISION" -t "$IMAGE-pdf" .
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test packaged web application
        run: |
          node scripts/binary-smoke-test.js --image "$IMAGE"
          node scripts/binary-smoke-test.js --image "$IMAGE-pdf"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish versioned images
        run: |
          docker push "$IMAGE"
          docker push "$IMAGE-pdf"
      - name: Publish latest tag
        run: |
          for suffix in "" -pdf; do
            docker tag "$IMAGE$suffix" "vvorth/inpx-shelf:latest$suffix"
            docker push "vvorth/inpx-shelf:latest$suffix"
          done
